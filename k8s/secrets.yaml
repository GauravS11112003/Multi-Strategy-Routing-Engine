apiVersion: v1
kind: Secret
metadata:
  name: routing-engine-secrets
  namespace: shipt-routing
  labels:
    app.kubernetes.io/part-of: shipt-routing-engine
type: Opaque
stringData:
  DATABASE_URL: "postgres://shipt:CHANGE_ME@postgres.shipt-routing.svc.cluster.local:5432/shipt_routing?sslmode=disable"
  OPENROUTE_API_KEY: "your_api_key_here"
