apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: shipt-routing
  labels:
    app: api
    app.kubernetes.io/part-of: shipt-routing-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: shipt-routing-engine/api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: routing-engine-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: routing-engine-secrets
                  key: DATABASE_URL
            - name: OPENROUTE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: routing-engine-secrets
                  key: OPENROUTE_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: shipt-routing
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api
