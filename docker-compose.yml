version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/bin/api"]
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://shipt:shipt_secret@postgres:5432/shipt_routing?sslmode=disable
      - OPENROUTE_API_KEY=${OPENROUTE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shipt
      POSTGRES_PASSWORD: shipt_secret
      POSTGRES_DB: shipt_routing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipt -d shipt_routing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
